[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tauri-runtime"
version = "0.1.0"
description = "Python SDK for tauri-plugin-py-runtime"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.9"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["tauri_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
