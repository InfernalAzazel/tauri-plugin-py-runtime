[project]
name = "vue-example-backend"
version = "0.1.0"
description = "Python backend of the tauri-plugin-py-runtime Vue example"
requires-python = ">=3.11"
dependencies = ["tauri-runtime"]

[dependency-groups]
dev = ["nuitka"]

[tool.uv]
package = false

[tool.uv.sources]
tauri-runtime = { path = "../../../python-sdk", editable = true }

[tool.tauri-runtime.build]
name = "py-backend"
