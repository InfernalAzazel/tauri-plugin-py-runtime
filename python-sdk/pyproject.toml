[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tauri-runtime"
version = "0.1.0"
description = "Python SDK for tauri-plugin-py-runtime"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9"]

[project.scripts]
tauri-runtime = "tauri_runtime.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["tauri_runtime"]

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
