[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tauri-runtime"
version = "0.1.1"
description = "Write the backend of Tauri 2 desktop apps in Python: commands, events, channels and standalone packaging"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "kylin" }]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9"]
keywords = ["tauri", "desktop", "gui", "ipc", "nuitka"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Framework :: Pydantic :: 2",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/InfernalAzazel/tauri-plugin-py-runtime"
Documentation = "https://github.com/InfernalAzazel/tauri-plugin-py-runtime#readme"
Repository = "https://github.com/InfernalAzazel/tauri-plugin-py-runtime"
Issues = "https://github.com/InfernalAzazel/tauri-plugin-py-runtime/issues"

[project.scripts]
tauri-runtime = "tauri_runtime.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["tauri_runtime"]

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
