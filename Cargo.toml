[package]
name = "tauri-plugin-py-runtime"
version = "0.1.0"
authors = ["kylin"]
description = "Tauri 2 plugin to write your app backend in Python: commands, events, channels and standalone packaging"
license = "MIT OR Apache-2.0"
repository = "https://github.com/InfernalAzazel/tauri-plugin-py-runtime"
homepage = "https://github.com/InfernalAzazel/tauri-plugin-py-runtime"
readme = "README.md"
keywords = ["tauri", "tauri-plugin", "python", "ipc", "desktop"]
categories = ["gui", "api-bindings"]
edition = "2021"
rust-version = "1.77.2"
include = ["/src", "/permissions", "/build.rs", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]
links = "tauri-plugin-py-runtime"

[dependencies]
tauri = { version = "2.11.6" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
strum = { version = "0.28", features = ["derive"] }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
